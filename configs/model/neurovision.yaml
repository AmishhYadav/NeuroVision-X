# The full NeuroVision-X model: dual encoder (CNN + Swin Transformer) -> adaptive gated
# cross-attention fusion -> U-Net decoder -> segmentation heads. This is the novel
# architecture; unet3d.yaml and swinunetr.yaml are the baselines it has to beat.

# Selected by string through neurovision.models.registry.
name: neurovision

in_channels: ${data.in_channels} # 4 MRI modalities
out_channels: ${data.num_classes} # 3 overlapping BraTS regions (ET/TC/WT), never 4

encoder:
  cnn:
    # FIVE levels (strides 1, 2, 4, 8, 16), one more than the Swin branch below. The Swin
    # branch's patch embedding merges 2x2x2 voxels before any attention runs, so it cannot
    # produce a stride-1 feature -- its pyramid starts at stride 2. CNN level 0 (stride 1)
    # therefore has no transformer counterpart and passes to the decoder UNFUSED; CNN
    # levels 1..4 fuse with Swin levels 0..3. See neurovision.models.encoders.swin's module
    # docstring for the full reasoning. NeuroVisionX.__init__ checks this offset at
    # construction time and refuses to build a mismatched pair.
    channels: [32, 64, 128, 256, 320]
    blocks_per_stage: [2, 2, 2, 2, 2]
    num_groups: 8
    dropout: 0.1
    use_checkpoint: false
    zero_init_residual: true
  swin:
    # The ablation switch for the whole transformer branch. false -> the Swin encoder is
    # NOT BUILT and NOT RUN, no fusion blocks are built, and the CNN pyramid passes to the
    # decoder unfused at every level. That is the cnn-only ablation
    # (configs/experiment/ablation_cnn_only.yaml), and it is a real removal, not a
    # turned-down fusion: `fusion.layer_scale_init: 0.0` would NOT work, because layer_scale
    # is a learnable parameter that starts at identity and then trains away from it.
    # Every other key in this block is simply unread when this is false.
    enabled: true
    # feature_size=48 must stay divisible by every entry of num_heads for per-head widths
    # to be integral (feature_size * 2**i / num_heads[i]).
    feature_size: 48
    depths: [2, 2, 2, 2]
    num_heads: [3, 6, 12, 24]
    window_size: 7
    patch_size: 2
    # FOUR levels, one fewer than the CNN branch above -- see the note there. Swin's own
    # fifth stage (stride 32) is deliberately never built here; see
    # neurovision.models.encoders.swin's module docstring for why it buys little at typical
    # patch sizes.
    num_levels: 4
    drop_rate: 0.0
    attn_drop_rate: 0.0
    dropout_path_rate: 0.0
    use_checkpoint: true
    normalize: true

fusion:
  # This is the ablation switch: adaptive_gated (the novel module) vs. concat (the standard
  # "everyone does this" baseline) vs. add (the floor -- a width-matching conv then a plain
  # residual add, no norm, no nonlinearity, no gating). Same four levels regardless of which
  # variant runs; every variant outputs the CNN branch's channel width at that level, so the
  # decoder below is identical across the ablation.
  name: adaptive_gated # adaptive_gated | concat | add
  num_heads: 4
  window_size: 4
  full_attention_max_tokens: 512
  gate_channels: scalar # scalar | channel
  gate_reduction: 4
  num_groups: 8
  attn_dropout: 0.0
  proj_dropout: 0.0
  layer_scale_init: 1.0e-4
  use_checkpoint: false
  # This single key is what isolates the project's actual contribution (see
  # docs/research/contribution.md): the gate is conditioned on an explicit
  # inter-branch ambiguity signal, not on branch content alone. true -> the
  # full gate (ours). false -> the content-only gate -- same architecture,
  # disagreement/entropy channels removed -- which is rung 2 of the P2
  # ablation ladder (fixed scalar blend < content-only gate < full gate).
  use_ambiguity: true

decoder:
  # null -> mirror the skip widths (UNetDecoder's own default: decoder_channels =
  # skip_channels[:-1]), so each decoder stage comes back out at the width of the skip it
  # merged with. Set explicit channels here only to deliberately narrow or widen the decoder
  # relative to the encoder pyramid.
  channels: null
  blocks_per_stage: 2
  num_groups: 8
  dropout: 0.0
  upsample: deconv # deconv | interp -- see unet_decoder.py's module docstring for the trade-off
  # Off by default, deliberately. This project's one novel contribution is the fusion module
  # between the two encoder branches; if the decoder also ran a second attention mechanism by
  # default, any improvement over a baseline could not be cleanly attributed to fusion alone.
  # Ablate this flag separately ("does decoder attention help on top of fusion") rather than
  # leaving it on.
  use_attention_gates: false
  use_checkpoint: false

head:
  # Segmentation head dropout. Non-zero is what makes MC-dropout uncertainty
  # possible later: a model trained at p=0.0 has no predictive spread to measure.
  #
  # 0.1, and this is a decision that CANNOT be retrofitted -- it changes training,
  # so a checkpoint trained at 0.0 can never be given a meaningful epistemic map
  # afterwards. It has to be right before the run starts.
  #
  # Why here and not in the decoder. Before this was set, the CNN encoder
  # (model.encoder.cnn.dropout: 0.1) was the ONLY source of MC-dropout
  # stochasticity in the whole network, and it is a weak one: its Dropout3d sits
  # before `conv2 -> norm2` in each ResidualBlock, and `zero_init_residual: true`
  # zeroes norm2.weight, so at init the perturbation is multiplied by exactly zero
  # and mutual information comes out 0 at every voxel (measured). That resolves
  # after one optimizer step, but it shows how thin the margin was.
  #
  # The segmentation head is the classic MC-dropout placement: Dropout3d
  # immediately before the 1x1x1 logit conv, so it perturbs the prediction
  # directly without degrading any intermediate feature, and with deep supervision
  # on there are three such heads. It also cannot be annihilated by a
  # zero-initialized norm the way the encoder's can.
  #
  # decoder.dropout above deliberately stays 0.0. Dropout3d drops WHOLE CHANNELS,
  # and doing that through the decoder at full resolution is a direct threat to the
  # boundary-accuracy half of the research claim -- the thing the paper is actually
  # about. Buying uncertainty diversity at the cost of boundary detail is the wrong
  # trade here.
  dropout: 0.1

  # The confidence head predicts, per voxel and per region, whether the
  # segmentation head's own prediction is correct there. Its target is built at
  # loss time from the (detached) segmentation output, so it is a read-out, not
  # a second segmenter. MUST agree with training.loss.name == multitask --
  # build_neurovision raises if they disagree.
  confidence:
    enabled: true
    hidden_channels: null   # null -> max(decoder_width // 2, out_channels, 8)
    num_groups: 8
    dropout: 0.0

  # The boundary head predicts the 1-voxel shell at each region's surface,
  # derived from the ground-truth label by a morphological gradient inside the
  # loss (no dataloader change). Auxiliary task for the boundary-accuracy claim.
  boundary:
    enabled: true
    hidden_channels: null
    num_groups: 8
    dropout: 0.0

# Number of decoder stages (fine to coarse, starting at full resolution) that get a
# segmentation head attached, i.e. how many outputs deep supervision produces. 1 disables
# deep supervision (a single full-resolution head). MUST agree with
# training.loss.deep_supervision.enabled -- neurovision.models.neurovision.build_neurovision
# raises if they disagree, because a value > 1 makes the model return a LIST of logits
# tensors in training mode, and only DeepSupervisionLoss knows how to consume that.
deep_supervision_levels: 3
