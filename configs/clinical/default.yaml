# Milestone 4 Phase E -- the clinical front-end. Turning a real hospital study
# into something the model may legally be fed.
#
# THIS RUNS IN .venv-clinical, not the training venv. See
# requirements-clinical.txt for why the three environments cannot be merged.
# Nothing in this group is needed to train or to evaluate, so a training
# session that never touches it costs nothing for its presence.

ingest:
  # E1: a DICOM study folder -> four named NIfTIs.

  # Chris Rorden's dcm2niix, shipped as a pip-installable binary in
  # .venv-clinical. null -> resolved from PATH with shutil.which at call
  # time, which is what makes the same config work on macOS and Linux.
  # Set explicitly only when a specific build must be pinned.
  dcm2niix_path: null

  # A series with fewer instances than this is not a diagnostic volume --
  # localisers, scouts and derived single-frame objects all land here. It is
  # deliberately low: a thick-slice clinical FLAIR can be 20-24 slices, and
  # refusing a real sequence is worse than admitting a scout that the rule
  # table will reject on other grounds anyway.
  min_instances: 8

  # Manual series -> role assignment from the UI, applied AFTER the automatic
  # rule table and overriding it. Keys are SeriesInstanceUID, values are one
  # of t1 / t1ce / t2 / flair. Empty by default: the automatic path is what
  # gets measured, and an override silently baked into config would make the
  # measured accuracy meaningless.
  role_overrides: {}

  # Where ingest writes the converted NIfTIs and its manifest. NOT
  # ${output_dir}: that interpolates experiment_name, and an ingested study
  # is a property of the study, not of any trained model.
  out_dir: outputs/clinical_ingest

preprocess:
  # E2: the four ingested NIfTIs -> co-registered, atlas-registered,
  # skull-stripped volumes in the geometry the model was trained in.
  #
  # This is the step that separates a demo from a tool. Today
  # app/backend/jobs.py runs only preprocess_case -- reorient, nonzero
  # z-score, crop -- so a skulled, unregistered clinical scan produces a
  # confident and completely wrong mask with nothing raising.
  #
  # Wraps brainles-preprocessing's AtlasCentricPreprocessor. The research
  # path (data/preprocessing.py) is NOT touched: this module produces the
  # same kind of input that BraTS already is, and the research path runs
  # afterwards exactly as it always has.

  # Which modality everything else is co-registered to. T1CE is the BraTS
  # convention and the right choice here for the same reason it is the QC
  # model's image channel: enhancing tumour and tumour core are DEFINED by
  # contrast enhancement.
  center_modality: t1ce

  # A member name of brainles_preprocessing.constants.Atlas. BRATS_SRI24 is
  # the atlas BraTS 2021 itself is registered to, so this is what makes a
  # clinical study land in the same space as the training data. Note this is
  # brainles' OWN atlas copy, fetched by its fetch_atlases() -- it is NOT
  # anatomy.atlas.dir (data/atlas/sri24), which is this project's separate
  # SRI24 copy used for anatomical reporting. Two copies of one atlas is not
  # ideal, but reusing ours would mean asserting the two are voxel-identical,
  # and phase0_atlas_findings.md already records that two assumptions about
  # this atlas were wrong.
  atlas: BRATS_SRI24

  # N4 is OFF by default because BraTS 2021 was not N4-corrected, so applying
  # it here would move a clinical study AWAY from the training distribution,
  # not toward it. Available for a study with visible bias field, at the cost
  # of a distribution mismatch that must then be stated.
  n4_bias_correction: false

  # HD-BET. On by default: BraTS is skull-stripped and the model has never
  # seen a skull.
  brain_extraction: true

  # Off by default. Defacing changes voxels the model may read, and this
  # pipeline is not the right place to make an irreversible privacy decision
  # on the user's behalf.
  defacing: false

  # null -> derived from cfg.device via get_device, so it cannot disagree
  # with the rest of the run. Set true/false only to override deliberately.
  # brainles' Preprocessor defaults this to True, which would try CUDA on a
  # Mac; the derivation exists to stop that.
  use_gpu: null

  # Keep every intermediate stage on disk (coregistration, atlas
  # registration, brain extraction, transformations). On by default: when a
  # clinical case produces a wrong mask, the question is always WHICH stage
  # went wrong, and without the intermediates that is unanswerable.
  keep_intermediate: true

  # Fixed, not ${output_dir}: a preprocessed study is a property of the
  # study, not of any trained model.
  out_dir: outputs/clinical_preprocess

input_qc:
  # E3 + E4: the gate that decides whether a study may be segmented at all.
  #
  # E4 (missing-sequence handling) is not a separate module because it IS
  # one of E3's checks -- "detect and refuse with a named reason" is exactly
  # what the sequence_completeness check does. Splitting them would put one
  # refusal rule in two places, which is how two copies of a rule drift.
  #
  # Every check here is LABEL-FREE by construction, not by convention. This
  # project has already shipped a reporting mask defined from the ground
  # truth; it manufactured 41-57% of a reported ECE behind a fully green
  # test suite. A deployment gate that consulted a label would be the same
  # bug with higher stakes, and there is no label at deployment anyway.

  # Which roles must be present. A study missing any of these is REFUSED
  # with the missing ones named. v1 refuses rather than synthesises; the
  # BraSyn line of work is a Phase-G stretch, recorded in the master plan.
  required_roles: [t1, t1ce, t2, flair]

  # Affine agreement tolerance between modalities, mm. Matches
  # app/backend/jobs.py::_AFFINE_ATOL so the API gate and this gate cannot
  # disagree about whether one study is geometrically consistent.
  affine_atol: 1.0e-4

  # Voxel spacing bounds, mm. Outside this range the volume is not a
  # diagnostic brain MRI at a resolution the model has ever seen -- BraTS is
  # 1 mm isotropic throughout.
  spacing_min_mm: 0.3
  spacing_max_mm: 3.0

  # Ratio of largest to smallest voxel dimension. A 5 mm-slice clinical
  # acquisition resampled to 1 mm in-plane is anisotropy 5, and the model has
  # never seen one; it is a WARN rather than a REFUSE because the
  # registration in E2 resamples it, and refusing every thick-slice clinical
  # study would refuse most real studies.
  anisotropy_warn_ratio: 2.0
  anisotropy_refuse_ratio: 6.0

  # Expected shape after E2's atlas registration. WARN, not REFUSE: a
  # different but self-consistent atlas is a legal configuration, and this
  # check exists to notice that E2 did not run, not to enforce one atlas.
  expected_shape: [240, 240, 155]

  # Brain volume bounds in millilitres, from the brain mask when one is
  # available. Deliberately wide: an adult brain is ~1100-1500 mL, but this
  # pipeline is also pointed at a paediatric cohort, and a bound tuned to
  # adults would refuse every child.
  brain_volume_min_ml: 600.0
  brain_volume_max_ml: 2600.0

  # Fraction of in-brain-mask voxels that are nonzero. A skull-stripped
  # volume is nearly all nonzero inside the mask; a near-empty channel means
  # the modality did not survive whatever produced it.
  min_nonzero_fraction_in_brain: 0.5

  # Fraction of the WHOLE volume that is nonzero. A skull-stripped brain
  # occupies roughly 10-25% of a 240x240x155 box; a volume where far more
  # than that is nonzero still has a head on it, which the model has never
  # seen. WARN, because the number is a heuristic and the honest failure
  # mode is a study that is fine and looks unusual.
  skull_present_warn_fraction: 0.45

  # A channel whose robust dynamic range (p99.5 - p0.5 over nonzero voxels)
  # is below this, in units of its own robust scale, is constant or nearly
  # so -- a dropped acquisition, not an image.
  min_dynamic_range: 1.0e-6

dicom_seg:
  # E6: export the mask as a DICOM Segmentation object, so it loads in OHIF
  # or any PACS instead of only in our own viewer.
  #
  # THE GEOMETRY TRAP, stated here because it is the thing that will go
  # wrong. After E2 the mask lives in ATLAS space (SRI24), not in the
  # geometry of the DICOM series it came from. A SEG that references the
  # source series while carrying atlas-space voxels renders a
  # plausible-looking overlay in the wrong place, and nothing raises -- the
  # exact shape of the demo geometry re-crop this project already caught by
  # recomputing a published Dice rather than by looking at a picture. So the
  # writer VALIDATES that the mask's shape and spacing match the reference
  # series and REFUSES otherwise. Resampling the mask back through E2's
  # saved inverse transform is a separate step and is not done here.

  # Written into SeriesDescription, whose DICOM value representation is LO
  # and therefore capped at 64 CHARACTERS. Keep this under that limit: the
  # first draft was 72 characters, and the only way to make it fit was to
  # bypass highdicom's validation and assign the attribute directly, which
  # produces a non-conformant object that a strict PACS may reject. A
  # disclaimer that gets the study rejected is not a disclaimer.
  series_description: "NeuroVision-X segmentation - RESEARCH ONLY, not diagnostic"

  # The full statement, written to ImageComments, whose VR is LT (10240
  # characters). The disclaimer is not decoration: the report artifact in
  # this repo already carries its disclaimer as a REQUIRED field rather than
  # as README text, and an object that leaves this pipeline for a PACS gets
  # the same discipline.
  disclaimer: >-
    Produced by NeuroVision-X, a research segmentation pipeline. FOR RESEARCH,
    EDUCATION AND DECISION SUPPORT ONLY. This object is not a diagnostic
    device, has not been clinically validated, and must not be used as the
    basis of a clinical decision. Segment boundaries are model output and
    carry no guarantee of accuracy on any individual study.

  # A high series number keeps the derived object sorting after the source
  # series in every viewer's series list.
  series_number: 9001

  manufacturer: "NeuroVision-X"
  manufacturer_model_name: "NeuroVision-X dual-encoder segmentation"
  software_versions: "milestone-4"
  device_serial_number: "neurovision-x-research"

  # BINARY, not FRACTIONAL. The model's deployed output is a hard mask after
  # postprocess_logits; writing it as fractional would imply a calibrated
  # per-voxel probability that the thresholded mask no longer carries.
  segmentation_type: BINARY

  # Fixed, not ${output_dir}: an exported study object is a property of the
  # study, not of any trained model.
  out_dir: outputs/clinical_dicom_seg
