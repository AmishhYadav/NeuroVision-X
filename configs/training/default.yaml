# Default training recipe.

epochs: 300

# 1, NOT 2. The real number of patches per optimizer step is
# batch_size * data.samples_per_volume, not batch_size: RandCropByPosNegLabeld
# returns a LIST of samples_per_volume crops per case, and list_data_collate
# flattens that list before batching. So batch_size: 1 with the default
# samples_per_volume: 4 already sends 4 patches of 96^3 per step; batch_size: 2
# would send 8, which is ~4x the activation memory the old "# 16 GB VRAM"
# comment assumed and OOMs SwinUNETR-B on a P100. batch_size: 1 with
# samples_per_volume: 4 is also the standard MONAI BraTS recipe.
# Raise this only after measuring, and remember to divide by samples_per_volume.
batch_size: 1
grad_accum_steps: 1 # effective batch = batch_size * samples_per_volume * grad_accum_steps

# Requested, not guaranteed. neurovision.utils.device.amp_enabled(device) is the
# final gate: AMP runs on CUDA only, and is ignored on CPU/MPS.
amp: true

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 10 # linear ramp from ~0; stops early transformer blocks diverging
  min_lr: 1.0e-6

loss:
  name: dice_ce # selected from neurovision.losses.registry
  dice_weight: 1.0
  ce_weight: 1.0

  # Overlapping BraTS regions -> one independent sigmoid per channel.
  # softmax would force the three regions to compete for probability mass,
  # but a voxel in the enhancing tumor is legitimately in ET, TC and WT at once.
  sigmoid: true
  softmax: false

  # MUST stay true. `include_background` means "include channel 0", and with
  # region targets channel 0 is ET — a real foreground region, not background.
  # Setting it false (copied from a softmax setup, where channel 0 really is
  # background) silently drops enhancing tumor from the Dice term.
  include_background: true

  squared_pred: false
  # Both non-zero, deliberately. Many BraTS cases have no enhancing tumor at
  # all, and at 96^3 patch level a large fraction of patches contain none of a
  # given region. With smooth_nr=0 a correctly predicted EMPTY channel scores
  # 0/(0+smooth_dr) = 0 Dice -> maximum loss for the right answer, which would
  # push the model to hallucinate tumor. Equal smoothing gives 1e-5/1e-5 = 1.
  smooth_nr: 1.0e-5
  smooth_dr: 1.0e-5

  # Deep supervision: loss also applied to lower-resolution decoder outputs.
  # Off HERE because the default model (unet3d) emits only one output. The
  # neurovision model emits several -- see model.deep_supervision_levels, and
  # note that build_neurovision RAISES if these two keys disagree, since a
  # model returning a list of logits into a loss that expects one tensor is a
  # crash at best and a silently mis-weighted objective at worst. Turned on in
  # configs/experiment/neurovision.yaml rather than flipped here, so the
  # baselines keep composing unchanged.
  deep_supervision:
    enabled: false
    # null -> auto halving weights (1, 0.5, 0.25, ...), normalized to sum 1.
    weights: null

  # Settings for `neurovision.losses.multitask.MultiTaskLoss`, selected by
  # `name: multitask` (see configs/experiment/neurovision.yaml). Inert unless
  # `name` is actually "multitask" -- present here so the key composes for
  # every experiment, but only the neurovision model has the heads these
  # terms score against.
  multitask:
    seg_weight: 1.0
    boundary:
      enabled: true
      weight: 0.3
      kernel_size: 3
      # The shell is a few percent of voxels, so the Dice term carries this
      # one; squaring the prediction in the denominator makes an already
      # thin-structure Dice even sharper. Left off to match the seg term.
      squared_pred: false
    confidence:
      enabled: true
      weight: 0.05
      threshold: 0.5
    surface:
      # OFF by default and this is a measured decision, not a preference.
      # MONAI's HausdorffDTLoss computes a Euclidean distance transform for
      # BOTH prediction and target on EVERY forward. On CUDA that path goes
      # through cuCIM/CuPy, which is the exact backend that already failed on
      # the Kaggle T4 image with "CompileException: Thrust requires at least
      # C++17" for HD95 (see CLAUDE.md). Without cuCIM it falls back to scipy,
      # which means a host round-trip: measured 0.72 s per step for the 24
      # transforms a 4-patch, 3-channel, 96^3 batch needs. That roughly doubles
      # step time on rationed Kaggle hours. The boundary HEAD above gets the
      # same signal for the price of two max_pool3d kernels.
      enabled: false
      weight: 0.1
      alpha: 2.0
      log: false # true -> LogHausdorffDTLoss

grad_clip_norm: 1.0

# --- Validation and logging ---
val_interval: 1 # epochs between validation passes
log_interval: 20 # optimizer steps between W&B logs
sliding_window:
  roi_size: ${data.patch_size}
  sw_batch_size: 4
  overlap: 0.5

# --- Checkpointing ---
# Kaggle kills sessions at 12 hours, so resume is the foundation, not a feature.
# A checkpoint carries model, optimizer, scheduler, AMP scaler, epoch, global
# step, RNG states, and the W&B run id.
checkpoint:
  dir: ${output_dir}/checkpoints
  save_every_n_epochs: 1
  keep_last_n: 2 # Kaggle working-dir quota is small; do not keep every epoch
  monitor: val/dice_mean
  mode: max
  resume: null # path to a checkpoint, or null to start fresh

# Wall-clock stop, in hours. Set below Kaggle's 12h limit so the run saves a
# final checkpoint and exits cleanly instead of being killed mid-epoch.
max_hours: 11.0
