# Post-hoc analysis drivers. Everything here is CPU-only and consumes artifacts
# that scripts/evaluate.py has already written -- no checkpoint, no GPU, no
# training run. Kept out of configs/inference/ because none of it runs a model.

burden:
  # Where burden.csv is written. null falls back to ${output_dir}, which
  # interpolates experiment_name -- fine for the default model, silently
  # misleading for any other (a profile computed from one model's predictions
  # landing in another model's directory). Set it explicitly whenever the
  # predictions do not come from the default experiment.
  out_dir: null
  # Which masks to profile.
  #   prediction - <eval_dir>/predictions/<case>.npy, saved in ORIGINAL BraTS
  #                geometry (240x240x155) by uncrop_to_original.
  #   label      - <preprocessed>/<case>/label.npy, CROPPED to the nonzero bbox.
  # The two live in different geometries, so the midline index differs by the
  # crop offset. Getting that wrong silently reports the wrong hemisphere, so
  # the script derives `cropped` from `source` and never takes it as a flag.
  source: prediction

  # Directory holding predictions/ and per_case_metrics.csv. Required when
  # source=prediction, ignored when source=label.
  eval_dir: null

  # Root of the preprocessed tree (holds <case>/meta.json and <case>/label.npy).
  # Always required: even for source=prediction, meta.json supplies spacing,
  # the affine and the crop bbox.
  preprocessed_dir: ${data.preprocessing.out_dir}

  # Which frozen split to profile. Phase 5 compares label-derived against
  # prediction-derived profiles, so both runs must name the same split.
  split: test

  # A component below this is not counted as a separate focus. 50 mm3 at 1 mm
  # isotropic matches inference.postprocess.min_component_size, so the
  # prediction side and the ground-truth side of a comparison use the same
  # floor -- ground-truth masks never went through that filter and would
  # otherwise count single-voxel specks as foci.
  min_volume_mm3: 50.0

  # 3 = 26-neighbourhood. Deliberately NOT inference.postprocess.connectivity
  # (which is 1): postprocess uses 6-connectivity to be aggressive about
  # REMOVING speckle, whereas counting foci must be conservative about
  # CLAIMING multifocality. See anatomy/burden.py's docstring.
  connectivity: 3

  # null -> derive from meta.json as (original_shape[0] - 1) / 2, minus the crop
  # offset when the source is cropped. Confirmed against atlas content: the
  # midpoint of the TZO _L and _R structure centroids lands at 119.1.
  midline_index: null

  out_name: burden.csv

localize:
  # Which masks to localise. Same convention as burden.source above -- see its
  # comment for the crop-offset hazard this mirrors exactly (the atlas is
  # cropped to match via anatomy/localize.py's atlas_for_case, so `cropped`
  # must follow `source`, never be set independently).
  #   prediction - <eval_dir>/predictions/<case>.npy, saved in ORIGINAL BraTS
  #                geometry (240x240x155) by uncrop_to_original.
  #   label      - <preprocessed>/<case>/label.npy, CROPPED to the nonzero bbox.
  source: prediction

  # Directory holding predictions/. Required when source=prediction, ignored
  # when source=label.
  eval_dir: null

  # Root of the preprocessed tree (holds <case>/meta.json and <case>/label.npy).
  # Always required: even for source=prediction, meta.json supplies spacing
  # and the crop bbox needed to align the atlas.
  preprocessed_dir: ${data.preprocessing.out_dir}

  # Which frozen split to localise.
  split: test

  # Regions to localise per case. ET and TC are kept alongside WT (rather than
  # collapsing to WT only) because enhancing-tumour involvement of an eloquent
  # structure is a clinically different statement from oedema simply reaching
  # it -- WT alone would erase that distinction.
  regions: [ET, TC, WT]

  # The two committed, versioned knowledge artifacts. localize_case validates
  # both against the loaded atlas at load time, so a stale or mistyped
  # structure name raises rather than silently mapping nothing.
  eloquence_map: knowledge/eloquence_map.yaml
  lobe_map: knowledge/aal_lobes.yaml

  # A structure row is dropped only when BOTH frac_of_structure AND
  # frac_of_tumour fall below this. 122 structures x 3 regions x 189 cases is
  # a large file, and a one-voxel clip of a neighbouring gyrus is measurement
  # noise, not a reportable involvement. The 'unlabelled' row is NEVER
  # dropped regardless of its fractions: frac_of_tumour is documented to sum
  # to 1.0 over the table, and dropping it would silently break that identity.
  min_frac: 0.001

  out_name: anatomy.csv
  summary_name: anatomy_summary.csv

  # Phase 3b: group-level and tissue-level overlap plus epicentre naming, from
  # the atlas this driver already has loaded. Adds columns to
  # anatomy_summary.csv; adds no new file and changes no existing column.
  involvement:
    enabled: true
    groups_map: knowledge/involvement_groups.yaml
    # A group overlap below this is not reported as contact. 50 mm3 matches
    # analysis.burden.min_volume_mm3 and inference.postprocess.min_component_size,
    # so a "touches the ventricles" claim needs the same amount of tissue that
    # counts as a real component everywhere else in this project.
    min_overlap_mm3: 50.0

report:
  # Directory holding burden.csv + burden_config.yaml, written by scripts/burden.py.
  burden_dir: null
  # Directory holding anatomy.csv, anatomy_summary.csv and localize_config.yaml,
  # written by scripts/localize.py.
  localize_dir: null
  # Read for `version` (recorded in provenance) and, for the eloquence map,
  # the classification name / evidence sentence / citation / coverage gaps.
  eloquence_map: knowledge/eloquence_map.yaml
  lobe_map: knowledge/aal_lobes.yaml
  # null -> every case present in BOTH input tables.
  cases: null
  # How many structure rows, sorted by frac_of_structure descending, reach the
  # report's anatomy block.
  top_n: 10
  markdown: true
  out_subdir: reports

report_agreement:
  # Reports generated with analysis.report.source=label -- the ground-truth
  # side of every comparison. Everything here is scored AGAINST this.
  gt_dir: null

  # Model display name -> that model's report directory. Set from the CLI with
  # '+analysis.report_agreement.pred_dirs.<name>=<dir>'. The name is what
  # appears in every output filename and in the comparison tables, so it
  # should be the experiment name, not the directory.
  pred_dirs: {}

  # Ordered [a, b] pairs to run the paired comparison on. Holm is applied once
  # per pair, across the whole returned table -- that table IS the declared
  # family, and splitting it would destroy the error-rate guarantee.
  #
  # PATCH SIZE IS A CONTROLLED VARIABLE HERE. neurovision, baseline_unet3d and
  # capacity_control_unet3d all trained and evaluated at 64^3 (verified from
  # each run's own eval_config.yaml), so they may share a family. The
  # superseded 96^3/200-epoch run differs in BOTH patch size and epochs and is
  # a confounded probe: report it separately, never inside a family with the
  # controlled three. docs/experiments.md note 18 measured that report
  # agreement is not monotonic in Dice, which is why this matters.
  comparisons: []

  # null -> every case present in both report directories.
  cases: null

  n_boot: 10000
  alpha: 0.05

population:
  # scripts/localize.py output directories to concatenate into one cohort.
  # They must agree on `source` and name DISTINCT splits -- run_population_stats
  # refuses both, because mixing ground truth with predictions, or counting one
  # split twice, changes every count while leaving every fraction plausible.
  localize_dirs: []

  # Which region the structure/lobe/laterality statistics describe. WT is the
  # right scope for "what does this lesion touch".
  region: WT

  # A structure counts as involved in a case at or above this frac_of_structure.
  # Thresholded on frac_of_structure and NOT frac_of_tumour: a structure can
  # hold a tiny share of the tumour while most of the structure is gone, and
  # the second quantity is the one a "how often is this affected" statistic
  # should read.
  min_frac_of_structure: 0.05

  top_n_structures: 20
  figures: true

detection:
  # Gate 1 of docs/research/execution_plan.md -- does per-voxel inter-branch
  # disagreement carry failure-detection signal that single-pass predictive
  # entropy does not already have? Registered in
  # docs/research/preregistration_ambiguity.md BEFORE any of this ran; read
  # that file before changing a threshold here. Runs no model and needs no
  # GPU -- every input is a cache scripts/extract_ambiguity.py and
  # scripts/evaluate.py already wrote.
  cohorts:
    # Each cohort names its own ambiguity shards (scripts/extract_ambiguity.py
    # is typically run in several chunked sessions -- see ambiguity_dirs
    # below), the matching scripts/evaluate.py output (for per_case_metrics.csv
    # and the saved logits/ the entropy baseline is computed from), and the
    # preprocessed tree (for ground-truth labels and spacing). SSA and PED are
    # the two EXTERNAL cohorts the pre-registered pass condition is scored
    # against -- see the "cohorts" list in the preregistration's Data section.
    - name: brats_test
      # Disjoint shard directories of the same cohort -- load_cohort raises if
      # a case_id appears in more than one, because an overlapping re-run
      # would double-count that case in every pooled statistic.
      # GLOBBED, not enumerated. A cohort is extracted in chunks by
      # scripts/extract_ambiguity_serial.py -- one process at a time, because
      # parallel workers put a 16 GiB laptop into swap twice -- so the number
      # of shard directories is not knowable when this file is written.
      # load_cohort expands the pattern, keeps only directories that actually
      # hold an ambiguity_summary.csv (an aborted launch leaves an empty one),
      # and still raises if a case_id appears in more than one of them.
      ambiguity_dirs: [outputs/ambiguity_test_*]
      eval_dir: outputs/neurovision/eval_test
      prep_dir: data/preprocessed/brats
    - name: ssa
      ambiguity_dirs: [outputs/ambiguity_ssa_*]
      eval_dir: outputs/eval_ssa_neurovision
      prep_dir: data/preprocessed/brats_ssa
    - name: ped
      ambiguity_dirs: [outputs/ambiguity_ped_*]
      eval_dir: outputs/eval_ped_neurovision
      prep_dir: data/preprocessed/brats_ped

  # NOT ${output_dir}/detection. output_dir interpolates experiment_name, whose
  # default is baseline_unet3d, so the Gate 1 tables -- which are computed from
  # the `neurovision` run's eval directories and say nothing about the baseline
  # -- landed in outputs/baseline_unet3d/detection/ on the first real run. This
  # project has already been bitten by a directory name that misdescribes whose
  # numbers are inside it (see CLAUDE.md, "three eval directories differ only by
  # suffix and two of them hold a U-Net"). The path is fixed here instead.
  out_dir: outputs/detection

  case:
    # Primary endpoint A. score/control are per-case scalars already written
    # by scripts/extract_ambiguity.py (amb_dis_mean_fg_mean, the predicted-
    # foreground-masked mean disagreement) and this script's own entropy_table
    # (ent_mean_fg_mean, the SAME masking convention -- computed from the
    # already-saved logits/, no extra model pass). metric is per-case Dice
    # from per_case_metrics.csv. Whatever these column names are, they must
    # exist in all three input tables after the join.
    score_column: amb_dis_mean_fg_mean
    control_column: ent_mean_fg_mean
    metric_column: dice_mean

  voxel:
    enabled: true
    # Label-free sampling mask (see neurovision.utils.io / CLAUDE.md's
    # "calibration reporting mask must never be defined using the ground-truth
    # label" entry -- that mistake manufactured 41-57% of a reported ECE and
    # passed 984 tests). "predicted_dilated": every voxel within dilation_mm
    # of the model's OWN predicted whole-tumour mask, computed from the
    # prediction alone. "all": every voxel in the volume (much larger, much
    # more background-dominated sample).
    mask: predicted_dilated # "predicted_dilated" | "all"
    dilation_mm: 10.0
    # Caps memory: only the SAMPLED voxels are ever held in memory, never a
    # whole cohort of full-resolution maps (see voxel_level_table's
    # docstring for the measured "tens of MB" figure at these defaults).
    max_voxels_per_case: 20000
    max_cases: null # null = every case with a saved ambiguity npz

  bootstrap:
    n_boot: 10000
    ci: 0.95

  # Family-wise significance level for the pre-registered 6-test family
  # (2 endpoints x 3 cohorts), Holm-corrected once, fixed before any p-value
  # is examined. See build_family_table in scripts/detection_stats.py.
  alpha: 0.05

  seed: ${seed}

# ---------------------------------------------------------------------------
# Gate 2 -- does entropy PLUS inter-branch disagreement localise per-voxel
# error better than entropy alone? Pre-registered in
# docs/research/preregistration_gate2.md BEFORE any number was computed; read
# that file before changing a threshold, the budget, or the fit split.
#
# Gate 1 settled two things that shape this block. Disagreement carries error
# information entropy lacks (residualised AUROC > 0.5 on all three cohorts),
# AND entropy's own raw AUROC is higher than disagreement's everywhere -- so
# the question is whether the two TOGETHER beat entropy, not whether
# disagreement beats it alone.
# ---------------------------------------------------------------------------
gate2:
  # The combiner is fitted here and scored nowhere. The val split backs no
  # reported number in this project, which is the only reason a fitted
  # quantity can be reported honestly at all -- the same rule that makes
  # temperature scaling fit on val and apply to test.
  fit_cohort:
    name: val
    ambiguity_dirs: [outputs/ambiguity_val_*]
    eval_dir: outputs/neurovision/eval_val
    prep_dir: data/preprocessed/brats

  # Applied FROZEN to each of these. `external: true` marks the cohorts the
  # pre-registered pass condition is scored on -- a detector that works only
  # in distribution does not address the failure that motivated the pivot.
  cohorts:
    - name: brats_test
      external: false
      ambiguity_dirs: [outputs/ambiguity_test_*]
      eval_dir: outputs/neurovision/eval_test
      prep_dir: data/preprocessed/brats
    - name: ssa
      external: true
      ambiguity_dirs: [outputs/ambiguity_ssa_*]
      eval_dir: outputs/eval_ssa_neurovision
      prep_dir: data/preprocessed/brats_ssa
    - name: ped
      external: true
      ambiguity_dirs: [outputs/ambiguity_ped_*]
      eval_dir: outputs/eval_ped_neurovision
      prep_dir: data/preprocessed/brats_ped

  out_dir: outputs/gate2

  # Same sampling contract as analysis.detection.voxel, deliberately: Gate 1
  # and Gate 2 must draw the SAME voxels under the SAME label-free mask, or a
  # difference between the gates is bookkeeping rather than signal.
  voxel:
    mask: predicted_dilated
    dilation_mm: 10.0
    max_voxels_per_case: 20000
    seed: ${seed}

  # Fraction of each case's sampled voxels the operational endpoint is allowed
  # to flag. Fixed at 5% in the pre-registration; a budget that can be tuned
  # after seeing the answer is not an endpoint.
  budget: 0.05

  bootstrap:
    n_boot: 10000
    ci: 0.95
    seed: ${seed}

  alpha: 0.05

  # Pre-registered magnitudes. Modest on purpose and for a stated reason:
  # entropy's baseline AUROC is already ~0.88 in distribution, so a 0.01 gain
  # on top of 0.88 is a different thing from 0.01 on top of 0.55. Always
  # reported next to the baseline it improves.
  thresholds:
    delta_auroc: 0.01
    delta_recall: 0.02

replay:
  # scripts/replay_logits.py -- re-scores a checkpoint's SAVED fp16 logits
  # (<eval_dir>/logits/) at a different threshold or post-processing chain,
  # with no model and no GPU. Same null-forces-an-explicit-CLI-override
  # convention as burden.eval_dir / localize.eval_dir above, rather than
  # baking one experiment's path into a committed config file:
  #   python scripts/replay_logits.py +analysis.replay.eval_dir=outputs/neurovision/eval_test
  eval_dir: null

  # Root of the preprocessed tree (holds <case>/label.npy and <case>/meta.json
  # for ground truth and spacing). Same default as burden.preprocessed_dir /
  # localize.preprocessed_dir above.
  prep_dir: ${data.preprocessing.out_dir}

  # Parent of this run's output directory. scripts/replay_logits.py appends
  # eval_dir's own basename (e.g. "eval_test" or
  # "eval_test_baseline_unet3d") in Python, not via OmegaConf interpolation --
  # no "basename of another config value" resolver is registered anywhere in
  # this project, and adding one is out of scope for a single driver script.
  # Appending the basename keeps two replays of different eval directories
  # from overwriting each other's threshold_sweep.csv / postprocess_ablation.csv
  # under one shared folder.
  out_dir: ${output_dir}/replay

  # null = every case with saved logits under <eval_dir>/logits/.
  case_ids: null

  threshold_sweep:
    enabled: true
    # Symmetric around the project default (0.5), which MUST stay in this
    # list -- best_threshold.json measures every other threshold's delta
    # against it and raises if it is absent.
    thresholds: [0.3, 0.4, 0.45, 0.5, 0.55, 0.6, 0.7]

  postprocess_ablation:
    enabled: true
    # variant name -> partial override, merged over the project default
    # post-processing chain (configs/inference/default.yaml's postprocess
    # block, minus threshold). Keys are exactly the five
    # replay._resolve_postprocess_cfg reads: enforce_nesting,
    # min_component_size, connectivity, keep_largest_only, et_min_volume --
    # verified against that function and against the block above before
    # naming these, so nothing here is a key that gets silently ignored.
    variants:
      default: {}
      no_small_component_removal: {min_component_size: 0}
      no_nesting: {enforce_nesting: false}
      keep_largest_only: {keep_largest_only: true}
      raw: {min_component_size: 0, enforce_nesting: false, keep_largest_only: false}

  baseline_comparison:
    enabled: false
    # A second eval dir to compare the replayed per-case table (at project
    # default threshold/post-processing) against, so a threshold or
    # post-processing choice made here can be shown to hold -- or not --
    # against a baseline scored the exact same way.
    eval_dir: null
