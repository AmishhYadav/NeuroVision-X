# Post-hoc analysis drivers. Everything here is CPU-only and consumes artifacts
# that scripts/evaluate.py has already written -- no checkpoint, no GPU, no
# training run. Kept out of configs/inference/ because none of it runs a model.

burden:
  # Which masks to profile.
  #   prediction - <eval_dir>/predictions/<case>.npy, saved in ORIGINAL BraTS
  #                geometry (240x240x155) by uncrop_to_original.
  #   label      - <preprocessed>/<case>/label.npy, CROPPED to the nonzero bbox.
  # The two live in different geometries, so the midline index differs by the
  # crop offset. Getting that wrong silently reports the wrong hemisphere, so
  # the script derives `cropped` from `source` and never takes it as a flag.
  source: prediction

  # Directory holding predictions/ and per_case_metrics.csv. Required when
  # source=prediction, ignored when source=label.
  eval_dir: null

  # Root of the preprocessed tree (holds <case>/meta.json and <case>/label.npy).
  # Always required: even for source=prediction, meta.json supplies spacing,
  # the affine and the crop bbox.
  preprocessed_dir: ${data.preprocessing.out_dir}

  # Which frozen split to profile. Phase 5 compares label-derived against
  # prediction-derived profiles, so both runs must name the same split.
  split: test

  # A component below this is not counted as a separate focus. 50 mm3 at 1 mm
  # isotropic matches inference.postprocess.min_component_size, so the
  # prediction side and the ground-truth side of a comparison use the same
  # floor -- ground-truth masks never went through that filter and would
  # otherwise count single-voxel specks as foci.
  min_volume_mm3: 50.0

  # 3 = 26-neighbourhood. Deliberately NOT inference.postprocess.connectivity
  # (which is 1): postprocess uses 6-connectivity to be aggressive about
  # REMOVING speckle, whereas counting foci must be conservative about
  # CLAIMING multifocality. See anatomy/burden.py's docstring.
  connectivity: 3

  # null -> derive from meta.json as (original_shape[0] - 1) / 2, minus the crop
  # offset when the source is cropped. Confirmed against atlas content: the
  # midpoint of the TZO _L and _R structure centroids lands at 119.1.
  midline_index: null

  out_name: burden.csv

localize:
  # Which masks to localise. Same convention as burden.source above -- see its
  # comment for the crop-offset hazard this mirrors exactly (the atlas is
  # cropped to match via anatomy/localize.py's atlas_for_case, so `cropped`
  # must follow `source`, never be set independently).
  #   prediction - <eval_dir>/predictions/<case>.npy, saved in ORIGINAL BraTS
  #                geometry (240x240x155) by uncrop_to_original.
  #   label      - <preprocessed>/<case>/label.npy, CROPPED to the nonzero bbox.
  source: prediction

  # Directory holding predictions/. Required when source=prediction, ignored
  # when source=label.
  eval_dir: null

  # Root of the preprocessed tree (holds <case>/meta.json and <case>/label.npy).
  # Always required: even for source=prediction, meta.json supplies spacing
  # and the crop bbox needed to align the atlas.
  preprocessed_dir: ${data.preprocessing.out_dir}

  # Which frozen split to localise.
  split: test

  # Regions to localise per case. ET and TC are kept alongside WT (rather than
  # collapsing to WT only) because enhancing-tumour involvement of an eloquent
  # structure is a clinically different statement from oedema simply reaching
  # it -- WT alone would erase that distinction.
  regions: [ET, TC, WT]

  # The two committed, versioned knowledge artifacts. localize_case validates
  # both against the loaded atlas at load time, so a stale or mistyped
  # structure name raises rather than silently mapping nothing.
  eloquence_map: knowledge/eloquence_map.yaml
  lobe_map: knowledge/aal_lobes.yaml

  # A structure row is dropped only when BOTH frac_of_structure AND
  # frac_of_tumour fall below this. 122 structures x 3 regions x 189 cases is
  # a large file, and a one-voxel clip of a neighbouring gyrus is measurement
  # noise, not a reportable involvement. The 'unlabelled' row is NEVER
  # dropped regardless of its fractions: frac_of_tumour is documented to sum
  # to 1.0 over the table, and dropping it would silently break that identity.
  min_frac: 0.001

  out_name: anatomy.csv
  summary_name: anatomy_summary.csv

  # Phase 3b: group-level and tissue-level overlap plus epicentre naming, from
  # the atlas this driver already has loaded. Adds columns to
  # anatomy_summary.csv; adds no new file and changes no existing column.
  involvement:
    enabled: true
    groups_map: knowledge/involvement_groups.yaml
    # A group overlap below this is not reported as contact. 50 mm3 matches
    # analysis.burden.min_volume_mm3 and inference.postprocess.min_component_size,
    # so a "touches the ventricles" claim needs the same amount of tissue that
    # counts as a real component everywhere else in this project.
    min_overlap_mm3: 50.0

report:
  # Directory holding burden.csv + burden_config.yaml, written by scripts/burden.py.
  burden_dir: null
  # Directory holding anatomy.csv, anatomy_summary.csv and localize_config.yaml,
  # written by scripts/localize.py.
  localize_dir: null
  # Read for `version` (recorded in provenance) and, for the eloquence map,
  # the classification name / evidence sentence / citation / coverage gaps.
  eloquence_map: knowledge/eloquence_map.yaml
  lobe_map: knowledge/aal_lobes.yaml
  # null -> every case present in BOTH input tables.
  cases: null
  # How many structure rows, sorted by frac_of_structure descending, reach the
  # report's anatomy block.
  top_n: 10
  markdown: true
  out_subdir: reports

report_agreement:
  # Reports generated with analysis.report.source=label -- the ground-truth
  # side of every comparison. Everything here is scored AGAINST this.
  gt_dir: null

  # Model display name -> that model's report directory. Set from the CLI with
  # '+analysis.report_agreement.pred_dirs.<name>=<dir>'. The name is what
  # appears in every output filename and in the comparison tables, so it
  # should be the experiment name, not the directory.
  pred_dirs: {}

  # Ordered [a, b] pairs to run the paired comparison on. Holm is applied once
  # per pair, across the whole returned table -- that table IS the declared
  # family, and splitting it would destroy the error-rate guarantee.
  #
  # PATCH SIZE IS A CONTROLLED VARIABLE HERE. neurovision, baseline_unet3d and
  # capacity_control_unet3d all trained and evaluated at 64^3 (verified from
  # each run's own eval_config.yaml), so they may share a family. The
  # superseded 96^3/200-epoch run differs in BOTH patch size and epochs and is
  # a confounded probe: report it separately, never inside a family with the
  # controlled three. docs/experiments.md note 18 measured that report
  # agreement is not monotonic in Dice, which is why this matters.
  comparisons: []

  # null -> every case present in both report directories.
  cases: null

  n_boot: 10000
  alpha: 0.05

population:
  # scripts/localize.py output directories to concatenate into one cohort.
  # They must agree on `source` and name DISTINCT splits -- run_population_stats
  # refuses both, because mixing ground truth with predictions, or counting one
  # split twice, changes every count while leaving every fraction plausible.
  localize_dirs: []

  # Which region the structure/lobe/laterality statistics describe. WT is the
  # right scope for "what does this lesion touch".
  region: WT

  # A structure counts as involved in a case at or above this frac_of_structure.
  # Thresholded on frac_of_structure and NOT frac_of_tumour: a structure can
  # hold a tiny share of the tumour while most of the structure is gone, and
  # the second quantity is the one a "how often is this affected" statistic
  # should read.
  min_frac_of_structure: 0.05

  top_n_structures: 20
  figures: true
