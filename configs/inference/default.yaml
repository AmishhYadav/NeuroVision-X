# Evaluation-time inference. Deliberately separate from
# training.sliding_window: that block is tuned for speed inside the epoch
# loop, and a final evaluation should not silently inherit that trade-off.

sliding_window:
  roi_size: ${data.patch_size}
  sw_batch_size: 4
  # Higher than training's 0.5. Overlap costs wall time linearly but reduces
  # the seam artifacts at window boundaries that inflate HD95.
  overlap: 0.5
  # gaussian weights a window's center voxels above its edges when blending
  # overlapping windows; "constant" weights them equally and leaves visible
  # seams. Costs nothing measurable.
  mode: gaussian
  # Fraction of roi_size used as the gaussian sigma. MONAI's default.
  sigma_scale: 0.125
  # Where the stitched full-volume output buffer is assembled -- MONAI's
  # `device` kwarg, NOT its `sw_device` kwarg (which is where each cropped
  # window is run through the model, and stays wherever the model already
  # lives). Named `output_device` here precisely because reusing MONAI's
  # `sw_device` name for its `device` parameter is a trap.
  # "cpu" keeps the buffer off the GPU, which matters for a 240^3 volume with
  # 3 channels on a 16 GB card; null means "same device as the input", and a
  # "cpu" value means sliding_window_predict returns a CPU tensor.
  output_device: null
  padding_mode: constant

mc_dropout:
  # Off by default: it multiplies evaluation cost by num_samples for a signal
  # nothing in the pipeline consumes yet. Turn on for the calibration phase.
  enabled: false
  # 10x the evaluation budget. The median case needs 12 sliding windows at
  # roi 96 / overlap 0.5 (max 36 across all 1251 cases), so this is ~120
  # windows per case. N=50+ appears in the literature and is not affordable
  # on ~30 rationed Kaggle hours a week. Note that mutual information is
  # biased LOW at small N, so never compare MI across runs with different N.
  num_samples: 10
  # null -> leave the global torch RNG alone. An int seeds it before the N
  # passes and restores the previous state afterwards, so a per-case loop is
  # reproducible and does not depend on how many cases ran before it.
  seed: null
  # Refuse to run when the model has no dropout module with p > 0. Every pass
  # would then be identical, mutual information would be exactly 0 everywhere,
  # and the returned uncertainty map would look plausible and mean nothing.
  require_dropout: true
  # "deterministic" (default): saved predictions and reported Dice/IoU/HD95
  # always come from the single deterministic pass, so turning MC-dropout on
  # never silently moves a number that is already reported elsewhere (e.g.
  # docs/experiments.md). "mc_mean" re-derives the prediction from the
  # MC-dropout mean probability instead -- an explicit opt-in for comparing
  # against the mean-pass prediction, which makes metrics from that run NOT
  # comparable to a deterministic-pass evaluation.
  predictions_from: deterministic
  # Which MCDropoutOutput tensor fields get written to disk, one .npy per
  # case per field (see scripts/evaluate.py's _MC_FIELD_TO_DIR for the
  # directory each maps to). Default is just the epistemic term:
  # mutual_information -> uncertainty/ is the fixed contract
  # notebooks/09_paper_figures.ipynb reads from. Add "mean_prob" /
  # "predictive_entropy" / "expected_entropy" only if you need them --
  # each one roughly doubles the per-case disk cost (see the storage-guard
  # warning scripts/evaluate.py logs after the first case).
  save_fields: [mutual_information]

postprocess:
  threshold: 0.5
  # Restores ET <= TC <= WT after the component filters break it. Leave on:
  # the nesting is anatomy, not a modelling convenience.
  enforce_nesting: true
  # Voxels. Drops speckle false positives that cost HD95 far more than Dice.
  min_component_size: 50
  # 1 = 6-neighbourhood (face-adjacent), 3 = 26-neighbourhood.
  connectivity: 1
  # Aggressive: collapses multifocal tumors to one lesion. Off by default.
  keep_largest_only: false
  # 0 disables. See postprocess_logits' docstring before turning this on --
  # it trades calibration honesty for ET Dice.
  et_min_volume: 0

evaluation:
  # Which frozen split to evaluate. "test" is the one that backs a reported
  # number; "val" is for iterating without touching test.
  split: test
  # Checkpoint to evaluate. null resolves to <training.checkpoint.dir>/best.pt.
  checkpoint: null
  # Root for everything this script writes.
  out_dir: ${output_dir}/eval_${inference.evaluation.split}
  # uint8 class map {0,1,2,3} per case, in ORIGINAL uncropped geometry.
  # ~8.9 MB/case at 240x240x155; ~1.3 GB for a 150-case split.
  save_predictions: true
  # float16 sigmoid probabilities (3, D, H, W) in CROPPED geometry. ~53 MB per
  # case, ~8 GB for a 150-case split -- past Kaggle's 20 GB working quota on
  # its own. Only needed for the calibration/ECE phase, which runs on a
  # subset. Default off deliberately.
  save_probabilities: false
  # float16 RAW LOGITS (3, D, H, W) in CROPPED geometry, same size and
  # geometry as save_probabilities. This is the artifact TEMPERATURE SCALING
  # needs, and probabilities cannot substitute for it. Measured: fp16's gap
  # below 1.0 is 0.000488, so any probability above ~0.99976 round-trips to
  # exactly 1.0 and its logit is +inf. A trained segmentation net is that
  # confident across most of the tumor core, so fitting a temperature from
  # saved probabilities would have to drop or clamp precisely the voxels that
  # drive miscalibration -- biasing the fitted temperature toward 1.0 and
  # understating overconfidence, with nothing failing anywhere. Logits sit
  # around +/-20, nowhere near fp16's +/-65504 limit, so they survive intact.
  # (The saturation is one-sided: near 0, fp16 subnormals reach 6e-8, so
  # p -> 0 is fine. Only p -> 1 collapses.) ECE/MCE/Brier and the reliability
  # diagram are unaffected either way -- 0.9998 and 1.0 fall in the same bin.
  save_logits: false
  # Refuse to run if the checkpoint's model.name disagrees with the current
  # config's. See resolve_checkpoint's docstring.
  strict_arch_check: true
