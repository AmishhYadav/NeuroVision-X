# @package _global_
#
# Shared body of the two Milestone-1 baseline runs.
#
# This file exists so that `baseline_unet3d` and `baseline_swinunetr` cannot
# drift apart. Everything that is NOT the architecture lives here exactly once:
# data, augmentation, optimizer, LR schedule, seed, checkpointing, stopping.
# The two experiment files that include it differ in exactly two lines each --
# `experiment_name` and the `override /model:` -- so any Dice/HD95/ECE gap
# between the runs is attributable to the encoder-decoder and to nothing else.
#
# Do not run this file directly; it sets no experiment_name.
# Do not add a model: block here. That is the one thing the children own.

# --- The controlled variables -------------------------------------------

# Same seed for both runs. This does NOT make them bit-identical (3D conv
# backward kernels are nondeterministic on CUDA regardless), but it does make
# them see the same split, the same case order, and the same crop positions
# for the same case, which removes data-order as an explanation for any gap.
seed: 42

data:
  # Explicitly restated rather than inherited, so that a later edit to
  # configs/data/brats.yaml cannot silently change what "the baseline" meant
  # halfway through the experiment table in docs/experiments.md.
  # 64^3, not the repo default 96^3, and this is a BUDGET decision forced by
  # measurement -- see the probe_neurovision rows in docs/experiments.md.
  # Measured on a real T4: `neurovision` runs at 3.6 s/step at 96^3, i.e.
  # 0.875 h/epoch over 875 steps, so 100 epochs costs ~91 h. The plan needs
  # that cost TWICE (the model and its parameter-matched P2 ablation) inside a
  # 60 h budget. At 64^3 the patch volume falls 3.4x and the step falls with
  # it, which is what brings the pair back inside the budget.
  #
  # It lives HERE, in the shared file, precisely because it must apply to every
  # arm equally. Patch size changes what the network sees; an architecture
  # comparison in which one arm saw 96^3 and another 64^3 would be measuring
  # two things at once. Both baselines and both fusion runs inherit it, so the
  # comparison stays controlled and the architecture itself is untouched.
  #
  # Cost to state in the paper: less spatial context per training patch, which
  # may cost a little whole-tumor Dice. Evaluation is unaffected in kind --
  # sliding-window inference already tiles the full volume -- but note
  # inference roi_size interpolates this key, so eval tiles at 64^3 too.
  patch_size: [64, 64, 64]
  pos_neg_ratio: [1, 1]
  samples_per_volume: 4

  augment:
    flip_prob: 0.5
    rot90_prob: 0.5
    scale_intensity_factor: 0.1
    shift_intensity_offset: 0.1
    noise_prob: 0.15
    noise_std: 0.01

  # Kaggle: ~13 GB RAM cannot cache 4-channel float32 volumes, and offline
  # preprocessing already removed the expensive part of the pipeline.
  dataset_type: dataset
  cache_rate: 0.0
  num_workers: 4

  overfit_n: null # never set on a reportable run

training:
  # 80 epochs x 875 train cases x 4 patches/case = 280,000 patch presentations,
  # against nnU-Net's reference 1000 x 250 x batch 2 = 500,000. So ~56% of a
  # standard full-length 3D segmentation schedule.
  #
  # Cut from 100 to 80 alongside the 64^3 patch size above, for the same
  # measured reason: at 0.875 h/epoch the pair of fusion runs did not fit in
  # 60 GPU-h. 64^3 does most of the work; this closes the remainder and leaves
  # margin for a failed session. The plan's own written trigger said that if
  # the probe came in over 0.20 h/epoch, all runs drop schedule TOGETHER --
  # they must share one schedule or nothing below is a controlled comparison.
  # This is that trigger firing, and it is why the value lives in the shared
  # file rather than in any single experiment.
  #
  # PICK THIS ONCE AND DO NOT CHANGE IT MID-RUN. The cosine schedule is defined
  # over `epochs`, so raising it on a resumed run silently rewrites the LR curve
  # the earlier epochs were trained under, and the run is then no longer any
  # single schedule.
  epochs: 80

  batch_size: 1 # x samples_per_volume 4 = 4 patches of 96^3 per optimizer step
  grad_accum_steps: 1
  amp: true

  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-5
    betas: [0.9, 0.999]

  scheduler:
    name: cosine
    warmup_epochs: 5 # 5% of the run, scaled down from the 10/300 default
    min_lr: 1.0e-6

  loss:
    name: dice_ce
    dice_weight: 1.0
    ce_weight: 1.0
    sigmoid: true
    softmax: false
    include_background: true # channel 0 is ET, a real region -- never false here
    squared_pred: false
    smooth_nr: 1.0e-5
    smooth_dr: 1.0e-5
    deep_supervision:
      enabled: false
      weights: null

  # 5.0, raised from 1.0 on 2026-08-08 by MEASUREMENT (probe v5), before any
  # reportable run started -- which is the only moment it can be changed.
  #
  # Measured for `neurovision` at 64^3, stable across three epochs:
  #   median 1.07-1.16 | p90 ~2.0 | max 3.9 | CLIPPED ON 66-70% OF STEPS
  #
  # At 1.0 this model spent ~70% of its training with the ENTIRE gradient
  # rescaled, i.e. at an effective learning rate the config does not describe.
  # Two consequences, both fatal to the plan rather than merely untidy:
  #
  #   1. `neurovision` and `ablation_content_only_gate` would clip at different
  #      rates (they differ in the ambiguity probes, hence in gradient
  #      magnitude), so the P2 comparison would confound "does conditioning on
  #      disagreement help?" with "did these two runs train at different
  #      effective segmentation LRs?". That ablation is the whole contribution.
  #   2. It silently defeats the deliberate choice NOT to normalize the
  #      multi-task loss weights. Segmentation is pinned at exactly 1.0 so its
  #      gradient is identical across ablations -- clipping the whole vector
  #      70% of the time undoes that, which is a caveat already recorded
  #      against the multi-task weights in CLAUDE.md.
  #
  # 5.0 sits above the measured maximum of 3.894, so clipping goes back to
  # being what it is for: a guard against rare spikes, not a de facto LR
  # schedule. The baseline is unaffected either way (unet3d's gradient norm at
  # init is 0.522) but shares the value, because a comparison in which one arm
  # clips and another does not is not a controlled one.
  #
  # DO NOT CHANGE THIS MID-RUN, and do not change it for one arm only.
  grad_clip_norm: 5.0

  # Validation is full sliding-window inference over all 187 val cases and is
  # NOT cheap. MEASURED for `neurovision` at 64^3 (probe v4): 4.5 s/case, so
  # 0.234 h for a full validation pass -- note that is MORE per case than the
  # 3.76 s measured at 96^3, because smaller windows means more of them to
  # tile the same volume.
  #
  # Every 10 epochs, not the previous 5. At 80 epochs that is 8 validation
  # points instead of 16, which halves validation from ~3.7 h to ~1.9 h per
  # fusion run and is what keeps the three-run plan inside 60 GPU-h with a
  # margin for a failed session. 8 points is still enough to see the curve and
  # pick a best checkpoint: the LR follows a cosine to min_lr, so val Dice
  # climbs and plateaus rather than oscillating, and the best checkpoint is
  # near the end.
  #
  # Changing this affects monitoring and best-checkpoint selection ONLY -- no
  # training math depends on it. It still lives here, in the shared file, so
  # that every arm's `best.pt` is selected from the same granularity; picking
  # the best of 16 points for one model and 8 for another would be a mild but
  # real confound in a comparison of best checkpoints.
  val_interval: 10
  log_interval: 20

  sliding_window:
    roi_size: ${data.patch_size}
    sw_batch_size: 4
    # 0.25, not the 0.5 used for final evaluation. Halving the stride overlap
    # roughly halves the number of windows per volume. This makes the monitored
    # val Dice very slightly pessimistic relative to the number that
    # scripts/evaluate.py will report, which is fine: this is a monitoring
    # signal, it is identical for both baselines, and nothing here is reported.
    # cfg.inference.sliding_window (overlap 0.5) is what produces paper numbers.
    overlap: 0.25

  checkpoint:
    dir: ${output_dir}/checkpoints
    save_every_n_epochs: 1 # resume is epoch-granular; a kill costs at most 1 epoch
    keep_last_n: 2 # SwinUNETR checkpoints are ~754 MB against a 20 GB /kaggle/working quota
    monitor: val/dice_mean
    mode: max
    resume: null # scripts/train.py auto-finds last.pt; only set to force a specific file

  # Under Kaggle's 12h wall clock. The trainer predicts whether the next epoch
  # fits and exits cleanly with a saved checkpoint rather than being SIGKILLed.
  # 10.5, lowered from 11.0 once the real epoch cost was measured.
  #
  # Trainer predicts whether the NEXT epoch fits using the MEAN epoch duration
  # so far. With val_interval 10, nine epochs in ten cost ~0.27 h and the
  # tenth costs ~0.51 h (it also validates), so the mean is ~0.30 h and
  # UNDERSTATES a validation epoch by ~0.21 h. Worst case: the check passes
  # just under the limit and the epoch that follows is a validation one.
  #
  # At 11.0 that lands at ~11.5 h, plus ~0.15 h of clone / pip / dataset setup
  # that happens before Trainer's clock even starts -- ~11.65 h against
  # Kaggle's hard 12 h kill, a ~20 minute margin. A kill lands mid-epoch with
  # no checkpoint written, losing that epoch's work.
  #
  # 10.5 puts the same worst case at ~11.2 h, a ~50 minute margin, and costs
  # nothing: at ~0.30 h/epoch it is 35 epochs per session against 37, and
  # neurovision's 80 epochs need three sessions either way.
  #
  # Purely operational -- it changes where sessions break, never what is
  # trained, so it does not need to match across arms the way patch_size and
  # grad_clip_norm do. It lives here only so every run behaves the same way.
  max_hours: 10.5

wandb:
  project: neurovision-x
  mode: online
  # Same group for both runs so W&B overlays their curves on one chart.
  group: milestone1_baselines
  tags: [baseline, milestone1]
