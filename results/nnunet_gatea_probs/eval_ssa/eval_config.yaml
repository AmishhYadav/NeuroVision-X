  root_dir: ???
  modalities:
  - t1
  - t1ce
  - t2
  - flair
  in_channels: 4
  regions:
  - ET
  - TC
  - WT
  num_classes: 3
  spacing:
  - 1.0
  - 1.0
  - 1.0
  normalize: nonzero_z_score
  crop_foreground: true
  patch_size:
  - 96
  - 96
  - 96
  pos_neg_ratio:
  - 1
  - 1
  samples_per_volume: 4
  augment:
    flip_prob: 0.5
    rot90_prob: 0.5
    scale_intensity_factor: 0.1
    shift_intensity_offset: 0.1
    noise_prob: 0.15
    noise_std: 0.01
    rotate_prob: 0.0
    rotate_range_deg: 15.0
    gamma_prob: 0.0
    gamma_range:
    - 0.7
    - 1.5
    bias_field_prob: 0.0
    bias_field_coeff_range:
    - 0.0
    - 0.3
    elastic_prob: 0.0
    elastic_sigma_range:
    - 5.0
    - 8.0
    elastic_magnitude_range:
    - 50.0
    - 150.0
  splits:
    path: configs/data/splits.yaml
    fractions:
    - 0.7
    - 0.15
    - 0.15
    seed: 42
    overwrite: false
  overfit_n: null
  num_workers: 4
  dataset_type: dataset
  cache_dir: outputs/cache
  cache_rate: 0.0
  preprocessing:
    out_dir: data/preprocessed/brats
    num_workers: 8
    overwrite: false
    require_seg: true
    limit: null
    metadata_csv: metadata.csv
    label_convention: brats2021
    target_axcodes:
    - L
    - P
    - S
model:
  name: unet3d
  in_channels: 4
  out_channels: 3
  channels:
  - 32
  - 64
  - 128
  - 256
  - 320
  strides:
  - 2
  - 2
  - 2
  - 2
  num_res_units: 2
  norm: instance
  activation: leakyrelu
  dropout: 0.1
  deep_supervision: false
training:
  epochs: 300
  batch_size: 1
  grad_accum_steps: 1
  amp: true
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 1.0e-05
    betas:
    - 0.9
    - 0.999
  scheduler:
    name: cosine
    warmup_epochs: 10
    min_lr: 1.0e-06
  loss:
    name: dice_ce
    dice_weight: 1.0
    ce_weight: 1.0
    sigmoid: true
    softmax: false
    include_background: true
    squared_pred: false
    smooth_nr: 1.0e-05
    smooth_dr: 1.0e-05
    deep_supervision:
      enabled: false
      weights: null
    multitask:
      seg_weight: 1.0
      boundary:
        enabled: true
        weight: 0.3
        kernel_size: 3
        squared_pred: false
      confidence:
        enabled: true
        weight: 0.05
        threshold: 0.5
      branch:
        enabled: false
        weight: 0.1
      surface:
        enabled: false
        weight: 0.1
        alpha: 2.0
        log: false
  grad_clip_norm: 1.0
  val_interval: 1
  log_interval: 20
  sliding_window:
    roi_size:
    - 96
    - 96
    - 96
    sw_batch_size: 4
    overlap: 0.5
  checkpoint:
    dir: outputs/baseline_unet3d/checkpoints
    save_every_n_epochs: 1
    keep_last_n: 2
    monitor: val/dice_mean
    mode: max
    resume: null
    init_from: null
  max_hours: 11.0
inference:
  sliding_window:
    roi_size:
    - 96
    - 96
    - 96
    sw_batch_size: 4
    overlap: 0.5
    mode: gaussian
    sigma_scale: 0.125
    output_device: null
    padding_mode: constant
  mc_dropout:
    enabled: false
    num_samples: 10
    seed: null
    require_dropout: true
    predictions_from: deterministic
    save_fields:
    - mutual_information
  tta:
    enabled: false
    axes:
    - 0
    - 1
    - 2
  postprocess:
    threshold: 0.5
    enforce_nesting: true
    min_component_size: 50
    connectivity: 1
    keep_largest_only: false
    et_min_volume: 0
  evaluation:
    split: test
    checkpoint: null
    out_dir: outputs/baseline_unet3d/eval_test
    save_predictions: true
    save_probabilities: false
    save_logits: false
    strict_arch_check: true
    boundary_bands:
    - - 0.0
      - 2.0
    - - 2.0
      - 5.0
    - - 5.0
      - 10.0
    - - 10.0
      - .inf
    lesionwise:
      enabled: false
      min_lesion_voxels: 50
      matching_threshold: 0.5
      nsd_tolerance_mm: 1.0
      connectivity: 26
calibration:
  fit_dir: null
  apply_dir: null
  out_dir: outputs/baseline_unet3d/calibration
  fit_prep_dir: null
  source: auto
  n_bins: 15
