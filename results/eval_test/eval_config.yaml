data:
  name: brats
  root_dir: /kaggle/input/datasets/amishyadav123/neurovision-brats-prep
  modalities:
  - t1
  - t1ce
  - t2
  - flair
  in_channels: 4
  regions:
  - ET
  - TC
  - WT
  num_classes: 3
  spacing:
  - 1.0
  - 1.0
  - 1.0
  normalize: nonzero_z_score
  crop_foreground: true
  patch_size:
  - 96
  - 96
  - 96
  pos_neg_ratio:
  - 1
  - 1
  samples_per_volume: 4
  augment:
    flip_prob: 0.5
    rot90_prob: 0.5
    scale_intensity_factor: 0.1
    shift_intensity_offset: 0.1
    noise_prob: 0.15
    noise_std: 0.01
  splits:
    path: /kaggle/input/datasets/amishyadav123/neurovision-brats-prep/splits.yaml
    fractions:
    - 0.7
    - 0.15
    - 0.15
    seed: 42
    overwrite: false
  overfit_n: null
  num_workers: 2
  dataset_type: dataset
  cache_dir: outputs/cache
  cache_rate: 0.0
  preprocessing:
    out_dir: /kaggle/input/datasets/amishyadav123/neurovision-brats-prep/preprocessed
    num_workers: 8
    overwrite: false
    require_seg: true
    limit: null
    metadata_csv: metadata.csv
model:
  name: unet3d
  in_channels: 4
  out_channels: 3
  channels:
  - 32
  - 64
  - 128
  - 256
  - 320
  strides:
  - 2
  - 2
  - 2
  - 2
  num_res_units: 2
  norm: instance
  activation: leakyrelu
  dropout: 0.1
  deep_supervision: false
training:
  epochs: 300
  batch_size: 1
  grad_accum_steps: 1
  amp: true
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 1.0e-05
    betas:
    - 0.9
    - 0.999
  scheduler:
    name: cosine
    warmup_epochs: 10
    min_lr: 1.0e-06
  loss:
    name: dice_ce
    dice_weight: 1.0
    ce_weight: 1.0
    sigmoid: true
    softmax: false
    include_background: true
    squared_pred: false
    smooth_nr: 1.0e-05
    smooth_dr: 1.0e-05
    deep_supervision:
      enabled: false
      weights: null
  grad_clip_norm: 1.0
  val_interval: 1
  log_interval: 20
  sliding_window:
    roi_size:
    - 96
    - 96
    - 96
    sw_batch_size: 4
    overlap: 0.5
  checkpoint:
    dir: outputs/baseline_unet3d/checkpoints
    save_every_n_epochs: 1
    keep_last_n: 2
    monitor: val/dice_mean
    mode: max
    resume: null
  max_hours: 11.0
inference:
  sliding_window:
    roi_size:
    - 96
    - 96
    - 96
    sw_batch_size: 4
    overlap: 0.5
    mode: gaussian
    sigma_scale: 0.125
    output_device: null
    padding_mode: constant
  postprocess:
    threshold: 0.5
    enforce_nesting: true
    min_component_size: 50
    connectivity: 1
    keep_largest_only: false
    et_min_volume: 0
  evaluation:
    split: test
    checkpoint: /kaggle/input/datasets/amishyadav123/neurovision-baseline-best/best.pt
    out_dir: /kaggle/working/eval_test
    save_predictions: true
    save_probabilities: false
    strict_arch_check: true
experiment_name: baseline_unet3d
seed: 42
device: auto
output_dir: outputs/baseline_unet3d
wandb:
  project: neurovision-x
  entity: null
  mode: disabled
  tags: []
  group: null
  run_id: null
