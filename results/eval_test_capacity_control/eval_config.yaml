    min_brain_dice: 0.85
    min_laterality_pairs_correct: 1.0
    midline_index: 119.5
    max_midline_deviation: 1.5
    qc_cases: 10
analysis:
  burden:
    source: prediction
    eval_dir: null
    preprocessed_dir: data/preprocessed/brats
    split: test
    min_volume_mm3: 50.0
    connectivity: 3
    midline_index: null
    out_name: burden.csv
