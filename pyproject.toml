[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-x"
version = "0.1.0"
description = "Reliable 3D brain tumor segmentation on BraTS multi-modal MRI"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/F  = pycodestyle + pyflakes (the baseline)
# I    = import sorting (replaces isort, which the stack does not use)
# UP   = pyupgrade — keeps syntax modern for the 3.11 floor
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["neurovision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
