[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-x"
version = "0.1.0"
description = "Reliable 3D brain tumor segmentation on BraTS multi-modal MRI"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Ruff lints .ipynb by default. Exclude them: notebooks here are thin drivers
# and analysis surfaces, not library code, and Black skips them too (the
# jupyter extra is not installed), so linting them enforces a standard nothing
# else applies and nothing can auto-fix. The rule that matters -- no training
# logic in a notebook cell -- is architectural, not a lint. Library code
# (src/, scripts/, tests/, app/) stays fully linted.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# E/F  = pycodestyle + pyflakes (the baseline)
# I    = import sorting (replaces isort, which the stack does not use)
# UP   = pyupgrade — keeps syntax modern for the 3.11 floor
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["neurovision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put src/ on sys.path so `pytest` works from the repo root without an
# editable install and without PYTHONPATH juggling. Keeps the Kaggle notebook
# driver simple too — it can run the suite before training with one command.
pythonpath = ["src"]
