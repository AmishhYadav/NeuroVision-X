# Studies known to be patients the deployed model TRAINED ON (MasterPlan W6.2).
#
# Why this file exists: the two real-DICOM demo studies (TCIA UPENN-GBM) are BraTS 2021
# training patients (experiments.md note 50, found by whole-brain image correlation; the
# official BraTS 2021 ID mapping does not cover UPENN-GBM). A PROCEED on such a study shows
# that the pipeline RUNS on scanner DICOM; it is no evidence of accuracy on unseen data.
# The clinical UI must say so on screen whenever one of these studies is shown.
#
# Matching: a clinical job matches an entry if ANY SeriesInstanceUID the ingest step
# assigned to a modality role is listed here. Series UIDs are globally unique DICOM
# identifiers, so a match is exact, never a guess.
#
# status: "confirmed" (unambiguous image match) or "probable" (best match on both tests,
# weaker separation). Never add an entry without evidence in experiments.md.

entries:
